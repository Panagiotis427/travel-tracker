name: Supabase keep-alive

# Supabase pauses a free project after 7 days without database activity. Twice a week this reads one row of
# `visits` with the site's public key: row-level security returns nothing to the anonymous role, but the query
# reaches Postgres, which is the activity Supabase counts. A failed run means the project is paused or unreachable.
# GitHub disables scheduled workflows in a public repository after 60 days without repository activity; any push,
# or `gh workflow enable supabase-keepalive.yml`, turns it back on.

on:
  schedule:
    - cron: "23 5 * * 1,4"   # Mondays and Thursdays 05:23 UTC, off the top of the hour, when queued runs can drop
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04     # pinned, like deploy.yml
    timeout-minutes: 5
    steps:
      - name: Query the database once
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/rest/v1/visits?select=place_id&limit=1")
          echo "HTTP $code"
          test "$code" = 200
